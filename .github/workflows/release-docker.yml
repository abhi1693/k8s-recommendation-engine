name: Release Docker Image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Exact release.json version from the validated release tag
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact validated release tag and source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash scripts/ci/check-release-identity.sh
  images:
    needs: release-identity
    uses: abhi1693/actions/.github/workflows/container-images.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      manifest: .github/images.json
      version-file: release.json
      version: ${{ inputs.version }}
      publish: true
      amd64-runner: ubuntu-24.04
      arm64-runner: ubuntu-24.04-arm
      scan: true
      scan-ignore-unfixed: false
      # This repository is public: keep signed GitHub attestations required.
      attest: true
      release-aliases: '["major","minor"]'
