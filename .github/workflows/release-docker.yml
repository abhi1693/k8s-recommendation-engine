---
name: Release Docker Image

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and publish GHCR image
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@59178a1adfb1547da9ba94fdd46962c510b8eb1f
    with:
      push: true
      matrix: '[{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]'
      image: ghcr.io/abhi1693/k8s-recommendation-engine
      context: .
      file: Dockerfile
      cache-scope: k8s-recommendation-engine
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest
        type=sha,prefix=sha-
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
